version: "2.0"

services:
  yieldswarm:
    image: ghcr.io/yield-swarm/v2.0:latest
    expose:
      - port: 3000
        as: 80
        to:
          - global: true
        accept:
          - defiswarmagents.com
          - defiswarmagents.info
    env:
      - NODE_ENV=production
      - PORT=3000
      - POLSIA_IN_PROCESS_CRONS_ENABLED=false
      - SOCKET_IO_ENABLED=true
      - UD_WIRE_BOOT=true
      - APP_URL=https://defiswarmagents.com
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    expose:
      - port: 5432
        to:
          - service: yieldswarm
    env:
      - POSTGRES_USER=yieldswarm
      - POSTGRES_PASSWORD=changeme_in_secrets
      - POSTGRES_DB=yieldswarm
    params:
      storage:
        data:
          mount: /var/lib/postgresql/data
          readOnly: false

profiles:
  compute:
    yieldswarm:
      resources:
        cpu:
          units: 1
        memory:
          size: 2Gi
        storage:
          - size: 20Gi
    db:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 20Gi
          - name: data
            size: 20Gi
            attributes:
              persistent: true
              class: default
  placement:
    akash:
      attributes:
        host: akash
      signedBy:
        anyOf:
          - "akash1365yvmc4s7awdyj3nzt8sqe8y76r83y8q2q5f"
      pricing:
        yieldswarm:
          denom: uakt
          amount: 8000
        db:
          denom: uakt
          amount: 4000

deployment:
  yieldswarm:
    akash:
      profile: yieldswarm
      count: 1
  db:
    akash:
      profile: db
      count: 1
