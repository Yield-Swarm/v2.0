apiVersion: v2beta2
kind: Manifest
metadata:
  name: yieldswarm-mining-rtx4090
  namespace: default

services:
  mining:
    image: nvidia/cuda:12.0.1-devel-ubuntu22.04
    env:
      - "WALLET_ADDRESS=YOUR_WALLET_ADDRESS"
      - "POOL_URL=YOUR_POOL_URL"
      - "WORKER_NAME=yieldswarm-rtx4090"
    command:
      - "/bin/bash"
    args:
      - "-c"
      - "apt-get update && apt-get install -y wget && wget -O /miner https://github.com/yieldswarm/mining/releases/download/v1.0.0/gpu-miner && chmod +x /miner && /miner --wallet $$WALLET_ADDRESS --pool $$POOL_URL --worker $$WORKER_NAME"
    resources:
      gpu:
        nvidia:
          - model: rtx4090
            quantity: 2
      memory:
        size: 64Gi
      cpu:
        units: 32
      storage:
        - size: 50Gi
    expose:
      - port: 8080
        as: 80
        to:
          - global: true
    params:
      compute:
        mining:
          resources:
            gpu:
              nvidia:
                - model: rtx4090
                  quantity: 2

profiles:
  compute:
    mining:
      resources:
        cpu:
          units: 32
        memory:
          size: 64Gi
        gpu:
          nvidia:
            - model: rtx4090
              quantity: 2
        storage:
          - size: 50Gi
  placement:
    akash:
      attributes:
        organization: akash.network
      pricing:
        mining:
          denom: uakt
          amount: 100000

deployment:
  mining:
    akash:
      profile: mining
      count: 1
