---
version: "2.0"

services:
  rainbow-miner:
    image: ghcr.io/yield-swarm/v2.0:latest
    expose:
      - port: 3000
        as: 80
        to:
          - global: true
      - port: 22
        to:
          - global: true
    env:
      - NODE_ENV=production
      - PORT=3000
      - POLSIA_IN_PROCESS_CRONS_ENABLED=false
      - SOCKET_IO_ENABLED=true
      - UD_WIRE_BOOT=true
      - APP_URL=https://defiswarmagents.com
      - ADMIN_SECRET= Codingis4kid$917!
      - MINING_MODE=aggressive
      - MINING_DURATION=48h
    command: ["bash", "-c", "node server.js & /app/scripts/start-48h-mining.sh"]

profiles:
  compute:
    rainbow-miner:
      resources:
        cpu:
          units: 8
        memory:
          size: 16Gi
        storage:
          - size: 100Gi
        gpu:
          units: 1
          attributes:
            vendor: nvidia
            model: a100
  placement:
    akash:
      attributes:
        host: akash
        capabilities/gpu: true
      pricing:
        rainbow-miner:
          denom: uakt
          amount: 50000

deployment:
  rainbow-miner:
    akash:
      profile: rainbow-miner
      count: 1
